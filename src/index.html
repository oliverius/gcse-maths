<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7f2">
  <title>Maths, one step at a time</title>
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <main>
    <header><p class="eyebrow">VISUAL MATHS TUTOR</p><h1>One step at a time.</h1><p>See what changes. Take all the time you need.</p></header>
    <nav id="lessons" aria-label="Choose a lesson"></nav>
    <section class="workspace" aria-label="Current lesson">
      <div class="step-heading"><span id="topic"></span><span id="counter"></span></div>
      <h2 id="step-title"></h2>
      <div id="visual" role="img"></div>
      <div class="explanation" aria-live="polite" aria-atomic="true"><p id="explanation"></p><p id="detail"></p></div>
      <nav class="controls" aria-label="Lesson steps"><button id="back">← Back</button><button id="replay">↺ Replay</button><button id="next">Next →</button></nav>
    </section>
    <footer>You control the pace. Nothing advances on its own.</footer>
  </main>
</body>
</html>
