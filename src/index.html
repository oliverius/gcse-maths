<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f7f2" />
    <title>Maths, one step at a time</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="stylesheet" href="vendor/katex/katex.min.css" />
    <link rel="stylesheet" href="css/styles.css" />
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <div class="toolbar">
      <button id="menu" aria-controls="sidebar" aria-expanded="true">
        Choose a lesson</button
      ><span class="toolbar-name">Maths Lab <span>Foundation GCSE</span></span>
      <div class="toolbar-actions">
        <a
          class="github-link"
          href="https://github.com/oliverius/gcse-maths"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="View Maths Lab on GitHub (opens in a new tab)"
          title="View on GitHub"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              fill="currentColor"
              d="M12 .7a11.5 11.5 0 0 0-3.6 22.4c.6.1.8-.2.8-.6v-2.2c-3.3.7-4-1.4-4-1.4-.5-1.4-1.3-1.7-1.3-1.7-1.1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.7 1.3 3.4 1 .1-.8.4-1.3.8-1.6-2.7-.3-5.5-1.3-5.5-5.7 0-1.3.5-2.3 1.2-3.1-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.2 1.2a11.1 11.1 0 0 1 5.8 0c2.2-1.5 3.2-1.2 3.2-1.2.6 1.6.2 2.8.1 3.1.8.8 1.2 1.8 1.2 3.1 0 4.4-2.8 5.4-5.5 5.7.4.4.8 1.1.8 2.1v3.1c0 .4.2.7.8.6A11.5 11.5 0 0 0 12 .7Z"
            />
          </svg>
        </a>
        <button id="fullscreen" aria-pressed="false">Full screen</button>
      </div>
    </div>
    <aside id="sidebar" aria-label="Lesson library">
      <h2>Your lessons</h2>
      <p>Choose a topic. Go at your pace.</p>
      <nav id="lessons" aria-label="Choose a lesson"></nav>
    </aside>
    <main id="main">
      <section class="workspace" aria-label="Current lesson">
        <h2 id="lesson-title" tabindex="-1">Loading lessons…</h2>
        <div class="step-heading">
          <span id="topic"></span><span id="counter"></span>
        </div>
        <h3 id="step-title"></h3>
        <p id="error" role="alert" hidden></p>
        <div id="visual" role="img"></div>
        <div class="explanation" aria-live="polite" aria-atomic="true">
          <p id="explanation"></p>
          <p id="detail"></p>
        </div>
        <nav class="controls" aria-label="Lesson steps">
          <button id="back">← Back</button><button id="replay">↺ Restart</button
          ><button id="next">Next →</button>
        </nav>
        <div class="curriculum">
          <span>Curriculum reference</span>
          <div id="references"></div>
        </div>
        <details id="tutor-notes">
          <summary>Tutor notes</summary>
          <div id="tutor-content"></div>
        </details>
      </section>
    </main>
  </body>
</html>
